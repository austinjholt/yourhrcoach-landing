# Partner referral links (co-branded via ref.js, which reads the code from the path).
# 200 rewrites: the visitor keeps the partner URL in the address bar and sees the homepage
# with the partner's logo. Generic: yourhrcoach.ai/go/<code> (e.g. /go/emerson-acme for a
# per-client link that still credits Emerson). Vanity paths must also be listed in ref.js.
[[redirects]]
  from = "/go/:code"
  to = "/index.html"
  status = 200
  force = true

# Emerson & Co. (Tim Emerson, ASO referral partner)
[[redirects]]
  from = "/emerson"
  to = "/index.html"
  status = 200
  force = true

# Ready Aim Climb
[[redirects]]
  from = "/readyaimclimb"
  to = "/index.html"
  status = 200
  force = true

# Partner pages are direct-link only: keep them out of Google and other search engines.
[[headers]]
  for = "/go/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/emerson"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/readyaimclimb"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
